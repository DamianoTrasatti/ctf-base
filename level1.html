<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPSIT CTF - Livello 1: Credenziali in Chiaro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #090d16;
            color: #00ff66;
        }
        .glow-text {
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }
        .glow-box {
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.15);
        }
        .terminal-bg {
            background: rgba(13, 27, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 102, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <header class="w-full max-w-4xl mx-auto text-center py-4 border-b border-emerald-900/50">
        <div class="inline-block px-3 py-1 mb-2 text-xs font-semibold rounded bg-emerald-950 text-emerald-400 border border-emerald-800">
            [ TPSIT - SICUREZZA INFORMATICA ]
        </div>
        <h1 class="text-3xl md:text-4xl font-bold tracking-wider glow-text">CAPTURE THE FLAG // LVL 1</h1>
        <p class="text-sm text-emerald-400/70 mt-1">Analisi del codice client-side e credenziali hardcoded</p>
    </header>

    <main class="w-full max-w-xl mx-auto my-8">
        <div class="terminal-bg rounded-xl p-6 md:p-8 glow-box">
            
            <div class="flex items-center justify-between pb-4 mb-6 border-b border-emerald-900/50">
                <div class="flex space-x-2">
                    <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
                </div>
                <div class="text-xs text-emerald-400/60">auth_service.js</div>
            </div>

            <form id="loginForm" onsubmit="login(event)" class="space-y-5">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-emerald-400/80 mb-2">Username:</label>
                    <input type="text" id="username" required 
                           class="w-full bg-slate-950/80 border border-emerald-800/60 rounded-lg px-4 py-3 text-emerald-300 focus:outline-none focus:border-emerald-400 transition"
                           placeholder="Inserisci username...">
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-emerald-400/80 mb-2">Password:</label>
                    <input type="password" id="password" required 
                           class="w-full bg-slate-950/80 border border-emerald-800/60 rounded-lg px-4 py-3 text-emerald-300 focus:outline-none focus:border-emerald-400 transition"
                           placeholder="Inserisci password...">
                </div>

                <button type="submit" 
                        class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-3 px-4 rounded-lg transition duration-200 shadow-lg shadow-emerald-900/30 glow-text cursor-pointer">
                    ACCEDI AL SISTEMA
                </button>
            </form>

            <div id="messageBox" class="mt-6 hidden p-4 rounded-lg border text-sm"></div>

        </div>
    </main>

    <footer class="w-full max-w-4xl mx-auto text-center text-xs text-emerald-500/40 py-2">
        TPSIT Lab &bull; Capture The Flag &bull; Damiano Trasatti
    </footer>

    <script>
        // ==========================================
        // GLOBAL_DATE CONFIGURAZIONE CREDENZIALI LIVELLO 1 (CTF)
        // ==========================================
        const GLOBAL_DATE = {
            ADMIN_USER: "admin",
            ADMIN_PASS: "1234",
            FLAG: "TPSIT{SIX_SEVEN_67676767676767}"
        };

        function login(event) {
            event.preventDefault();

            const userInput = document.getElementById('username').value.trim();
            const passInput = document.getElementById('password').value.trim();
            const messageBox = document.getElementById('messageBox');

            messageBox.classList.remove('hidden');

            // Verifica delle credenziali direttamente nel codice JavaScript
            if (userInput === GLOBAL_DATE.ADMIN_USER && passInput === GLOBAL_DATE.ADMIN_PASS) {
                messageBox.className = "mt-6 p-4 rounded-lg border bg-emerald-950/80 border-emerald-500 text-emerald-300 animate-pulse";
                messageBox.innerHTML = `
                    <div class="font-bold text-base mb-1">🎉 ACCESSO AUTORIZZATO!</div>
                    <p class="text-xs mb-2">Complimenti, hai completato con successo il Livello 1.</p>
                    <div class="mt-3 p-3 bg-slate-950 rounded border border-emerald-600 text-emerald-400 font-mono text-center select-all">
                        FLAG: <strong>${GLOBAL_DATE.FLAG}</strong>
                    </div>
                `;
            } else {
                messageBox.className = "mt-6 p-4 rounded-lg border bg-red-950/80 border-red-500 text-red-300";
                messageBox.innerHTML = `
                    <div class="font-bold mb-1">❌ ACCESSO NEGATO</div>
                    <p class="text-xs">Username o password non corretti. Ispeziona il codice sorgente JavaScript per scoprire le credenziali corrette.</p>
                `;
            }
        }
    </script>

</body>
</html>
